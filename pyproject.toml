[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yemen-customer-service-agent"
version = "0.0.0"
description = "Synthetic customer service storage and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "pydantic>=2.12,<3", "jsonschema>=4.26,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
customer-service-mcp = "yemen_customer_service.tool_server.server:main"
customer-service-demo = "yemen_customer_service.tool_server.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["yemen_customer_service*"]
namespaces = false
